name: check
on: [push, pull_request]

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean

  typst:
    runs-on: ubuntu-26.04
    env:
      TYPSTYLE_VERSION: 0.15.0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # setup typst
      - uses: typst-community/setup-typst@v5
        with:
          typst-versions-file: typst/typst-toolchain.toml

      # setup typstyle
      - id: cache-typstyle
        uses: actions/cache@v6
        with:
          path: typstyle
          key: ${{ runner.os }}-typstyle-${{ env.TYPSTYLE_VERSION }}
      - if: steps.cache-typstyle.outputs.cache-hit != 'true'
        run: |
          curl -L -o typstyle https://github.com/Enter-tainer/typstyle/releases/download/v${{ env.TYPSTYLE_VERSION }}/typstyle-x86_64-unknown-linux-gnu && \
          chmod +x typstyle

      - run: ./typstyle --check .

      # setup fonts
      - id: cache-fonts
        uses: actions/cache@v6
        with:
          path: typst/fonts
          key: ${{ runner.os }}-fonts-2

      # check
      - env:
          TYPST_FONT_PATHS: typst/fonts
        run: |
          typst/x prepare-fonts
          typst/x check

  # catch solutions whose name does not fit the collection globs
  orphans:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # setup node & pnpm
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
          #package_json_file: www/package.json
          version: 11.18.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: www/package.json
          cache: pnpm
          cache-dependency-path: www/pnpm-lock.yaml

      # check only needs picomatch so skip the postinstall
      - working-directory: www
        run: |
          pnpm i --frozen-lockfile --ignore-scripts
          pnpm check:orphans
